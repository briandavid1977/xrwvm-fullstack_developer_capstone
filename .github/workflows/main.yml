name: Lint Code

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint_python:
    name: Lint Python Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install Flake8
        run: python -m pip install flake8

      - name: Run Python Linter
        run: |
          git ls-files -z '*.py' | xargs -0 python -m flake8
          echo "Linted all Python files successfully"

  lint_js:
    name: Lint JavaScript Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Install JSHint
        run: npm install --global jshint@2.13.6

      - name: Run JavaScript Linter
        run: |
          git ls-files -z 'server/database/*.js' | xargs -0 jshint
          echo "Linted all backend JavaScript files successfully"
